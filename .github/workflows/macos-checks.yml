name: macOS checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build for Ventura Intel
        run: xcodebuild -project LoockMesa.xcodeproj -scheme LoockMesa -configuration Debug -derivedDataPath /tmp/LoockBuild CODE_SIGNING_ALLOWED=NO build
      - name: Model checks
        run: bash Tests/run.sh
      - name: Desktop interaction checks
        run: bash Tests/run-ui-checks.sh
      - name: Clock rendering checks
        run: bash Tests/run-clock-checks.sh
      - name: Package standalone Intel app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LoockMesa-0.36.2-Intel
          path: dist/LoockMesa-0.36.2-Intel.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: widget-previews-0362
          path: dist/previews/*.png
          if-no-files-found: error
