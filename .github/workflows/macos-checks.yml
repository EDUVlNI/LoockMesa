name: macOS checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build for Ventura Intel
        run: xcodebuild -project Gergelim.xcodeproj -scheme Gergelim -configuration Debug -derivedDataPath /tmp/LoockBuild CODE_SIGNING_ALLOWED=NO build
      - name: Cursor artwork checks
        run: |
          xcrun swiftc LoockMesa/Services/CursorThemeService.swift Tests/CursorChecks.swift -o /tmp/cursor-checks
          /tmp/cursor-checks
      - name: Model checks
        run: bash Tests/run.sh
      - name: Desktop interaction checks
        run: bash Tests/run-ui-checks.sh
      - name: Clock rendering checks
        run: bash Tests/run-clock-checks.sh
      - name: Eko power and menu regressions
        run: bash Tests/run-eko-checks.sh
      - name: Package standalone Intel app
        run: bash scripts/build-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Gergelim-1.4.1-Intel
          path: dist/Gergelim-1.4.1-Intel.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: widget-gergelim-previews-141
          path: dist/previews/*.png
          if-no-files-found: error
